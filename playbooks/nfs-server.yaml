---
- name: Configure NFS server (Ubuntu 24.04 & CentOS 9)
  hosts: fileserver
  become: true

  tasks:

    # -------------------------
    # INSTALAR PAQUETES
    # -------------------------

    - name: Install NFS packages on RedHat
      ansible.builtin.dnf:
        name: nfs-utils
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install NFS packages on Debian
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    # -------------------------
    # CREAR DIRECTORIO
    # -------------------------

    - name: Create shared NFS directory on RedHat
      ansible.builtin.file:
        path: /srv/nfs/shared
        state: directory
        owner: nobody
        group: nobody
        mode: '0777'
      when: ansible_os_family == "RedHat"

    - name: Create shared NFS directory on Debian
      ansible.builtin.file:
        path: /srv/nfs/shared
        state: directory
        owner: nobody
        group: nogroup
        mode: '0777'
      when: ansible_os_family == "Debian"

    # -------------------------
    # EXPORTS
    # -------------------------

    - name: Configure NFS exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: '/srv/nfs/shared 192.168.10.0/24(rw,sync,no_subtree_check)'
        state: present
        create: true
      notify: Reload exports

    # -------------------------
    # SERVICIO
    # -------------------------

    - name: Enable and start NFS service on RedHat
      ansible.builtin.systemd:
        name: nfs-server
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Enable and start NFS service on Debian
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    # -------------------------
    # FIREWALL
    # -------------------------

    - name: Open NFS port on RedHat firewall
      ansible.builtin.command: firewall-cmd --permanent --add-port=2049/tcp
      when: ansible_os_family == "RedHat"
      notify: Reload firewall

    - name: Allow NFS on Ubuntu firewall
      ansible.builtin.command: ufw allow 2049/tcp
      when: ansible_os_family == "Debian"

    - name: Copy test file to server
      ansible.builtin.template:
        src: ../templates/README-NFS.j2
        dest: /srv/nfs/shared/README-NFS.txt
        owner: nobody
        mode: u=r,g=r,o=r

  handlers:

    - name: Reload exports
      ansible.builtin.command: exportfs -ra

    - name: Reload firewall
      ansible.builtin.command: firewall-cmd --reload
      when: ansible_os_family == "RedHat"